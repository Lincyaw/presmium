packages:
  - packages/*
  - examples/*
  - .agents/skills/presmium-animate/gallery
  - e2e/fixtures/regression
  - site
allowBuilds:
  '@ast-grep/lang-python': false
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  '@vscode/vsce-sign': false
  esbuild: true
  koffi: false
  node-pty: false
  playwright-chromium: true
  protobufjs: false
minimumReleaseAgeExclude:
  - '@playwright/test@1.64.1'
  - playwright-chromium@1.64.1
  - playwright-core@1.64.1
  - playwright@1.64.1
