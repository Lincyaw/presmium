# Presmium's documentation site: a Presmium workspace, built with `presmium build` here
# (`pnpm --filter presmium-docs build`, see README.md). Each document uses canonical index.pmd,
# with a complete English document in locales/en/index.pmd, published under /<document>/en/
# and the home page in English under /en/.
title: Presmium 文档
site:
  lang: zh-CN
  locales:
    en: { title: Presmium documentation }
  nav:
    - { text: Presmium Studio, link: 'https://presmium.lincyaw.com/studios/new?mode=design', icon: presmium }
    - { text: API, link: /api/ }
    - { text: GitHub, link: 'https://github.com/Lincyaw/presmium' }
  footer:
    message: Apache-2.0
    copyright: Presmium contributors
  head:
    description: Presmium editable teaching documents for the web, slides and notebooks
