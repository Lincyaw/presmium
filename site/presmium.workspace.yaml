# Presmium's documentation site: a Presmium workspace, built with `presmium build` here
# (`pnpm --filter presmium-docs build`, see README.md). Each document uses canonical lecture.json,
# with a complete English document in locales/en/lecture.json, published under /<document>/en/
# and the home page in English under /en/.
title: Presmium 文档
documents: [guide/lecture.json, plugins/lecture.json, reference/lecture.json]
site:
  lang: zh-CN
  locales:
    en: { title: Presmium documentation }
  nav:
    - { text: API, link: /api/ }
    - { text: GitHub, link: 'https://github.com/Lincyaw/presmium' }
  footer:
    message: Apache-2.0
    copyright: Presmium contributors
  head:
    description: Presmium editable teaching documents for the web, slides and notebooks
