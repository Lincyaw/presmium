<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Preview protocol host</title>
  <style>
    html, body { margin: 0; height: 100%; }
    iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!--
    A workbench stand-in without any framework (docs/studio.md 4): it embeds one preview, sends the
    workbench's messages and keeps those of the page, as e2e/preview-protocol.spec.ts drives it through
    `window.host`. It takes a message only from the iframe's window, from the preview's origin, with its nonce.
  -->
  <iframe id="preview" title="preview"></iframe>
  <script>
    const frame = document.getElementById('preview')
    const received = []
    let nonce = ''
    let origin = ''
    window.addEventListener('message', (event) => {
      const data = event.data
      if (event.source !== frame.contentWindow || event.origin !== origin) return
      if (!data || data.protocol !== 'presmium-preview' || data.nonce !== nonce) return
      received.push(data)
    })
    window.host = {
      received,
      /** Opens a preview's address with this nonce. */
      open(src, value) {
        nonce = value
        origin = new URL(src).origin
        const url = new URL(src)
        url.searchParams.set('presmium-preview', value)
        frame.src = url.href
      },
      /** Sends a message with the nonce, or with another one. */
      send(type, fields = {}, other) {
        frame.contentWindow.postMessage({ protocol: 'presmium-preview', version: 1, nonce: other ?? nonce, type, ...fields }, origin)
      },
      /** The messages of a type received so far. */
      of(type) {
        return received.filter(message => message.type === type)
      },
    }
  </script>
</body>
</html>
