title: Presmium
# The order of the sidebar and of the pager: listed documents first, then any other the patterns find.
documents:
  - "showcase-content/lecture.json"
  - "showcase-steps/lecture.json"
  - "showcase-code/lecture.json"
  - "showcase-classroom/lecture.json"
  - "showcase-publishing/lecture.json"
  - "tutorial-editing/lecture.json"
  - "tutorial-narration/lecture.json"
  - "learn/lecture.json"
  - "bubble-sort/lecture.json"
  - "libraries/lecture.json"
  - "promo/lecture.json"
  - "animation-library/algorithms/lecture.json"
  - "animation-library/data/lecture.json"
  - "animation-library/math-ml/lecture.json"
  - "animation-library/text/lecture.json"
  - "animation-library/emphasis/lecture.json"
  - "animation-library/structure/lecture.json"
  - "animation-library/product/lecture.json"
  - "animation-library/transitions/lecture.json"
  - "animation-library/paths-3d/lecture.json"
  - "animation-library/craft/lecture.json"
  - "animation-library/timeline/lecture.json"
  - "animation-library/lengths/lecture.json"
  - "animation-library/story/lecture.json"
  - "animation-library/films/lecture.json"
  - "*/lecture.json"
  - "animation-library/*/lecture.json"
site:
  lang: zh-CN
  theme: showcase
  params:
    accent: violet
    typography: sans
    contentWidth: wide
    logo: ./site/assets/logo.svg
    logoAlt: ""
  landing:
    template: ./site/home.html
  head:
    description: Presmium 示例合集：功能合集、教程、完整课程、傅里叶小课、宣传片与动画效果参考。
  footer:
    message: Presmium 示例
  nav:
    - text: 首页
      link: /
    - text: 示例
      link: /#/examples
    - text: 教程
      link: /#/examples/tutorials
    - text: GitHub
      link: https://github.com/Lincyaw/presmium
