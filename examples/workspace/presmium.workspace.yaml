# The example workspace (README.md): its documents are the subdirectories with a lecture.md (the
# default pattern '*/lecture.md', so documents created or renamed on the home page are listed too).
title: 分词入门（示例工作区）
site:
  footer: { message: Presmium 的示例工作区 }
settings:
  presmium.workspace:
    # The plugins the documents list, installed at the workspace root (package.json, and the link
    # try.mjs makes): presmium serve loads only these.
    plugins:
      - '@presmium/slidev-addon-core'
      - '@presmium/slidev-addon-stage'
      - '@presmium/slidev-addon-code'
      - '@presmium/slidev-addon-exec'
      - '@presmium/slidev-addon-exec-wasi'
      - '@presmium/slidev-addon-exec-webgpu'
      - '@presmium/slidev-addon-guide'
      - '@presmium/slidev-addon-content'
      - '@presmium/slidev-addon-publish'
      - '@presmium/slidev-addon-session'
      - '@presmium/slidev-addon-classroom'
      - '@presmium/slidev-addon-lecture'
      - '@presmium/slidev-addon-speech'
      - '@presmium/slidev-addon-assistant'
