<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>书卷 · 幻灯片</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;family=Noto+Serif+SC:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 56px 72px 40px; background: {{c.bg}}; color: {{c.ink}}; font-family: 'IBM Plex Sans', 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; gap: 28px;">
  <div style="display: flex; align-items: baseline; gap: 16px;">
    <span style="font-size: 16px; letter-spacing: 0.08em; color: {{c.accent}}; font-weight: 600;">用 Python 实现</span>
    <span style="flex: 1; height: 1px; background: {{c.line}}; align-self: center;"></span>
  </div>
  <h1 style="margin: 0; font-family: 'Source Serif 4', 'Noto Serif SC', serif; font-weight: 600; font-size: 52px; line-height: 1.15;">统计相邻对</h1>
  <div style="flex: 1; display: flex; gap: 32px; min-height: 0;">
    <div style="flex: 1.25; display: flex; flex-direction: column; border-radius: 14px; border: 1px solid {{c.line}}; background: {{c.surface}}; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid {{c.line}}; font-size: 15px; color: {{c.muted}};">
        <span style="font-family: 'IBM Plex Mono', monospace;">Python</span><span>· 浏览器中运行</span>
        <button type="button" style="margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 8px; border: 0; background: {{c.ink}}; color: {{c.bg}}; font-size: 16px; font-weight: 500;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>运行
        </button>
      </div>
      <pre style="margin: 0; padding: 18px 22px; font-family: 'IBM Plex Mono', monospace; font-size: 22px; line-height: 1.6; color: {{c.ink}};"><span style="color: {{c.kw}};">def</span> get_stats(ids):
    counts = {}
    <span style="color: {{c.kw}};">for</span> pair <span style="color: {{c.kw}};">in</span> zip(ids, ids[1:]):
        counts[pair] = counts.get(pair, 0) + 1
    <span style="color: {{c.kw}};">return</span> counts</pre>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 16px;">
      <div style="border-radius: 14px; background: {{c.sunk}}; padding: 18px 22px;">
        <div style="font-size: 14px; color: {{c.muted}}; margin-bottom: 8px;">输出 · 0.02 秒</div>
        <pre style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 22px; line-height: 1.6;">(97, 97): 4
(97, 98): 2
(98, 100): 1</pre>
      </div>
      <p style="margin: 0; font-family: 'Source Serif 4', 'Noto Serif SC', serif; font-size: 26px; line-height: 1.5;">次数最多的一对是 <span style="padding: 0 8px; border-radius: 6px; background: {{c.accentSoft}}; color: {{c.accent}}; font-family: 'IBM Plex Mono', monospace;">a a</span>，下一步就合并它。</p>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 16px; font-size: 14px; color: {{c.muted}};">
    <span>BPE 分词</span>
    <div aria-label="第 2 步，共 3 步" style="display: flex; gap: 6px; margin-left: auto;">
      <span style="width: 22px; height: 4px; border-radius: 2px; background: {{c.accent}};"></span>
      <span style="width: 22px; height: 4px; border-radius: 2px; background: {{c.accent}};"></span>
      <span style="width: 22px; height: 4px; border-radius: 2px; background: {{c.line}};"></span>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace;">12 / 33</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const light = { bg: '#F7F5F0', surface: '#FFFFFF', sunk: '#EFEBE3', ink: '#1C1B19', muted: '#5C584F', line: '#E3DED3', accent: '#0F5F5C', accentSoft: '#E2EEEC', kw: '#8A3B12' };
    const dark = { bg: '#161614', surface: '#1F1E1B', sunk: '#2A2925', ink: '#EDEAE3', muted: '#A9A498', line: '#33312C', accent: '#6FC1B9', accentSoft: '#1D3330', kw: '#E59A6B' };
    return { c: this.props.dark ? dark : light };
  }
}
</script>
</body>
</html>
