name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v5
      - name: Set the site path
        env:
          PRESMIUM_PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const file = 'presmium.workspace.yaml'
          const source = readFileSync(file, 'utf8')
          if (!/^  base:.*$/m.test(source)) throw new Error('Missing site.base')
          writeFileSync(file, source.replace(/^  base:.*$/m, () => '  base: ' + JSON.stringify(process.env.PRESMIUM_PAGES_BASE)))
          NODE
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
