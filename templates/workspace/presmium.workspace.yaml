# A workspace (docs/ir.md section 10): copy this file, and the .gitignore beside it, to the root of a git
# repository whose documents are its subdirectories, each with a lecture.md. Then `presmium serve` there,
# or `presmium build`.
title: 课程名称
documents: ['*/lecture.md']         # where the documents are, in this order; default '*/lecture.md'
site: {}                            # the site shell: nav, footer, head, sitemap (as renderers.web)
approvals: { operate: ask, spend: ask, write: ask, agent: ask }
settings:                           # the plugins' operator settings, by plugin id; never in a deck
  presmium.workspace:
    plugins: []                     # operator plugins, installed here: every document and the home page load them
  # presmium.assistant:
  #   review: required                       # agent changes wait for the author's review (auto: committed at once)
