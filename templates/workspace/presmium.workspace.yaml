# A workspace (docs/ir.md section 10): this file at the root of a git repository whose documents are its
# subdirectories, each with a lecture.md. `presmium new --type workspace` makes one. Then `presmium serve`
# there, or `presmium build`.
title: 课程名称
documents: ['*/lecture.md']         # where the documents are, in this order; default '*/lecture.md'
site: {}                            # the site shell: nav, footer, head, sitemap (as renderers.web)
approvals: { operate: ask, spend: ask, write: ask, agent: ask }
settings:                           # the plugins' operator settings, by plugin id; never in a deck
  presmium.workspace:
    # The operator plugins: every document loads them. The official ones come with presmium; others are
    # installed at this root (pnpm add -D <package>). The assistant gives the readers "提问" (each reader's
    # own model, in the browser).
    plugins: ['@lincyaw/slidev-addon-assistant']
  # presmium.assistant:
  #   review: required                       # agent changes wait for the author's review (default auto: committed when each turn ends)
