allowBuilds:
  '@ast-grep/lang-python': false
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  '@vscode/vsce-sign': false
  esbuild: true
  koffi: false
  msedge-tts: false
  node-pty: false
  playwright-chromium: true
  protobufjs: false
# Presmium's own packages install as soon as they are released; pnpm's minimumReleaseAge still delays every other package.
minimumReleaseAgeExclude:
  - '@lincyaw/*'
  - create-presmium
