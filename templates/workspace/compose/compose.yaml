# A shared deployment of a Presmium workspace (SHARED mode; docs/architecture.md 10.1, 10.5; D13).
#
#   browser ─► oauth2-proxy (public: the one published port; edge) ─► serve (edge only, on its address)
#   serve ─► gateway (edge, agents, egress: the only one with third-party credentials and the internet)
#   serve ─► sandbox (agents only): agent-host runs the decks' code, builds, the site's dev servers, agents
#
# serve, gateway and sandbox run one image as three users with different uids; serve and sandbox start
# as root, read their token files (only root can read them) and become their user. serve runs none of
# the decks' code; sandbox reaches the gateway only; nothing but oauth2-proxy publishes a port.
#
# Before `docker compose up -d --build`: a seed workspace in ./seed (or PRESMIUM_SEED), the token files in
# ./secrets (mode 0600, see README.md), the login settings in oauth2-proxy.env and the third-party
# credentials in .env (the gateway's only). The init service prepares the workspace volume once.
name: presmium

x-presmium: &presmium
  image: ${PRESMIUM_IMAGE:-presmium-workspace:local}
  restart: unless-stopped

services:
  init:
    <<: *presmium
    build:
      # A checkout of Presmium after `pnpm install` (PRESMIUM_SOURCE when this file is used from elsewhere).
      context: ${PRESMIUM_SOURCE:-../../..}
      dockerfile: templates/workspace/compose/Dockerfile
    restart: 'no'
    user: root
    command: [/opt/presmium/templates/workspace/compose/init.sh]
    network_mode: none
    volumes:
      - workspace:/workspace
      - operator:/operator
      - ${PRESMIUM_SEED:-./seed}:/seed:ro

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0@sha256:786bed0f000c0f8a7b31619244ebab02406a8856a4faf3f5fb1df61fbd6c30ed
    restart: unless-stopped
    # The identity provider, the client, the cookie (its domain covers the site's and the console's host names).
    env_file: oauth2-proxy.env
    command:
      - --http-address=0.0.0.0:4180
      - --upstream=http://${PRESMIUM_EDGE:-172.31.79}.11:4310/
      # serve tells the site from the owner console by the Host; it trusts this proxy by its address.
      - --pass-host-header=true
      - --pass-user-headers=true
      - --skip-provider-button=true
    ports:
      - ${PRESMIUM_PORT:-8080}:4180
    networks:
      public: {}
      edge:
        ipv4_address: ${PRESMIUM_EDGE:-172.31.79}.10

  serve:
    <<: *presmium
    user: root
    command: [presmium, serve, /workspace, --host, '${PRESMIUM_EDGE:-172.31.79}.11', --port, '4310', --trust-proxy-from, '${PRESMIUM_EDGE:-172.31.79}.10', --user, serve]
    environment:
      HOME: /home/serve
      PRESMIUM_GATEWAY_URL: http://gateway:4320
      PRESMIUM_GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
      PRESMIUM_AGENT_HOST_URL: http://sandbox:4330
      PRESMIUM_AGENT_HOST_TOKEN_FILE: /run/secrets/agent_host_token
      PRESMIUM_CONSOLE_HOST: ${PRESMIUM_CONSOLE_HOST:?the owner console's host name, e.g. console.course.example.edu}
      # New document directories get the group sandbox may write (10.5).
      PRESMIUM_DOCUMENTS_GROUP: presmium-docs
    secrets: [gateway_token, agent_host_token]
    volumes:
      - workspace:/workspace
    networks:
      # Listens on its edge address only; on agents it only connects (to agent-host and the site there).
      edge:
        ipv4_address: ${PRESMIUM_EDGE:-172.31.79}.11
      agents: {}
    depends_on:
      init:
        condition: service_completed_successfully
      gateway:
        condition: service_started
      sandbox:
        condition: service_started

  gateway:
    <<: *presmium
    user: root
    command: [presmium, gateway, /workspace, --operator-dir, /operator, --host, 0.0.0.0, --port, '4320', --hostname, gateway, --serve, 'http://${PRESMIUM_EDGE:-172.31.79}.11:4310', --user, gateway]
    # Every third-party credential (model, speech, remote environments) is here and nowhere else.
    env_file: .env
    environment:
      HOME: /home/gateway
      PRESMIUM_GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
    secrets: [gateway_token]
    volumes:
      # The workspace configuration and the operator's packages only.
      - workspace:/workspace:ro
      - operator:/operator
    networks: [edge, agents, egress]
    depends_on:
      init:
        condition: service_completed_successfully

  sandbox:
    <<: *presmium
    user: root
    command: [presmium, agent-host, /workspace, --host, 0.0.0.0, --port, '4330', --hostname, sandbox, --user, sandbox]
    environment:
      HOME: /home/sandbox
      PRESMIUM_GATEWAY_URL: http://gateway:4320
      PRESMIUM_AGENT_HOST_TOKEN_FILE: /run/secrets/agent_host_token
    secrets: [agent_host_token]
    volumes:
      # Writable by the file permissions in the document directories only (init.sh).
      - workspace:/workspace
    networks: [agents]
    depends_on:
      init:
        condition: service_completed_successfully

  classroom:
    <<: *presmium
    user: classroom
    command: [presmium-classroom-server, --port, '1234', --host, 0.0.0.0]
    networks: [edge]

networks:
  # The one network with oauth2-proxy alone, where the published port is and the identity provider is reached.
  public: {}
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${PRESMIUM_EDGE:-172.31.79}.0/24
  agents:
    internal: true
  # The gateway's way out: models, speech, remote environments.
  egress: {}

volumes:
  workspace: {}
  operator: {}

secrets:
  gateway_token:
    file: ./secrets/gateway_token
  agent_host_token:
    file: ./secrets/agent_host_token
