# DeepSeek Harness patch for Presmium's author agent in SHARED mode (D13, D15; docs/architecture.md 4.8,
# 10.6), run by `presmium agent-host`: no shell, no command execution, no network tools. The agent has
# the file tools (confined to the session's directory) and Presmium's MCP tools; code runs only through
# MCP's run_code, in agent-host, as the owner allows. The row ids are those of the pinned version;
# packages/addon-assistant/test/dsh.test.ts checks them with `--dump-config`.

# No session-log upload, no session telemetry, no plugin inventory sent with requests.
- id: session-log-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: ask

# Shell (the sandbox backends stay: the permission presets need them, and nothing runs through them).
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

# Command execution: background jobs, model-written programs, workflows and subagents.
- id: tool-jobs
  disabled: true
- id: ptc-runtime
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true

# Network: web search and fetch.
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true
- id: tool-web
  disabled: true
