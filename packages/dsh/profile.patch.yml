- id: session-log-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true

- id: skill-filesystem
  config:
    agentsHome: !!js process.env.DSH_AGENTS_HOME || `${process.env.DSH_HOME}/agents`

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: ask

- id: system-prompt
  config:
    personaPrefix: >-
      You are Presmium's assistant for the authors of lectures, powered by the {{model}} model. You help
      write and revise lecture documents (MyST Markdown that Presmium renders as a web page, slides and a
      notebook), run their code and check them, in the author's language.
