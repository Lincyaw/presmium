- id: session-log-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true

# Connector account operations use the host subprocess service. Agent file and
# shell execution still use DeltaBox's private candidate services.
- id: subprocess
  disabled: false

# One workspace's conversations and host records (the launcher's workspaceState): Harness lists and reopens every
# session of its root, so the workspaces of one home do not share it.
- id: session-persistence-jsonl
  config:
    root: !!js process.env.PRESMIUM_DSH_SESSIONS || `${process.env.DSH_HOME}/sessions`
- id: storage-json
  config:
    root: !!js process.env.PRESMIUM_DSH_STORAGES || `${process.env.DSH_HOME}/storages`

- id: skill-filesystem
  config:
    agentsHome: !!js process.env.DSH_AGENTS_HOME || `${process.env.DSH_HOME}/agents`

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: ask

# Preserve read-before-write and stale-file refusals in the private candidate view.
- id: fs-observation-policy
  disabled: false

- id: system-prompt
  config:
    personaPrefix: >-
      You are Presmium's assistant for the authors of lectures, powered by the {{model}} model. You help
      write and revise lecture documents (MyST Markdown that Presmium renders as a web page, slides and a
      notebook), run their code and check them, in the author's language.
