      name: '@presmium/dsh'

- id: ui-layout
  disabled: true
- id: ui-brand-official
  disabled: true
- id: ui-settings-account
  disabled: true
- id: account-controller
  disabled: true
- id: deepseek-account
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: ui-settings-web-search
  disabled: true
- id: ui-settings-session-log
  disabled: true
