- insert:
    - id: presmium-service
      name: '@lincyaw/dsh/service'
      config:
        url: !!js process.env.PRESMIUM_SERVICE_URL
        token: !!js process.env.PRESMIUM_SERVICE_TOKEN
        root: !!js process.env.PRESMIUM_WORKSPACE || process.cwd()
    - id: presmium-events
      name: '@lincyaw/dsh/events'
    - id: presmium-tools
      name: '@lincyaw/dsh/tools'
    - id: presmium-policy
      name: '@lincyaw/dsh/policy'
    - id: presmium-context
      name: '@lincyaw/dsh/context'
    - id: presmium-skills
      name: '@lincyaw/dsh/skills'
    - id: presmium-turns
      name: '@lincyaw/dsh/turns'
    # The operator's collector (off without a URL): every session's events, and the author's operations in the workbench.
    - id: presmium-telemetry
      name: '@lincyaw/dsh/telemetry'
      config:
        url: !!js process.env.PRESMIUM_TELEMETRY_URL
        headers: !!js process.env.PRESMIUM_TELEMETRY_HEADERS
        user: !!js process.env.PRESMIUM_TELEMETRY_USER
