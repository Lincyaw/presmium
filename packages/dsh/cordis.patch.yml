- insert:
    - id: presmium-service
      name: '@lincyaw/dsh/service'
      config:
        url: !!js process.env.PRESMIUM_SERVICE_URL
        token: !!js process.env.PRESMIUM_SERVICE_TOKEN
        root: !!js process.env.PRESMIUM_WORKSPACE || process.cwd()
    - id: presmium-tools
      name: '@lincyaw/dsh/tools'
    - id: presmium-policy
      name: '@lincyaw/dsh/policy'
    - id: presmium-context
      name: '@lincyaw/dsh/context'
    - id: presmium-skills
      name: '@lincyaw/dsh/skills'
    - id: presmium-turns
      name: '@lincyaw/dsh/turns'
