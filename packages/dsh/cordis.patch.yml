# DeltaBox owns execution inside Presmium's per-session candidate. Publication and
# author review remain one Presmium transaction, with source guards and validation.
- id: deltabox-runtime
  disabled: true
- id: deltabox-review-policy
  disabled: true
- id: ptc-runtime
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true

- insert:
    - id: presmium-deltabox-runtime
      name: '@lincyaw/dsh/deltabox-runtime'
      config:
        binary: !!js process.env.DELTABOX_BINARY ?? 'deltabox'
        fsMode: cbcow-private
        projectSessionReuse: false
    - id: presmium-service
      name: '@lincyaw/dsh/service'
      config:
        presmium: !!js process.env.PRESMIUM_COMMAND
        url: !!js process.env.PRESMIUM_SERVICE_URL
        token: !!js process.env.PRESMIUM_SERVICE_TOKEN
        root: !!js process.env.PRESMIUM_WORKSPACE || process.cwd()
    - id: presmium-events
      name: '@lincyaw/dsh/events'
    - id: presmium-tools
      name: '@lincyaw/dsh/tools'
    - id: presmium-policy
      name: '@lincyaw/dsh/policy'
    - id: presmium-context
      name: '@lincyaw/dsh/context'
    - id: presmium-skills
      name: '@lincyaw/dsh/skills'
    - id: presmium-turns
      name: '@lincyaw/dsh/turns'
    # The operator's collector (off without a URL): every session's events, and the author's operations in the workbench.
    - id: presmium-telemetry
      name: '@lincyaw/dsh/telemetry'
      config:
        url: !!js process.env.PRESMIUM_TELEMETRY_URL
        headers: !!js process.env.PRESMIUM_TELEMETRY_HEADERS
        user: !!js process.env.PRESMIUM_TELEMETRY_USER
