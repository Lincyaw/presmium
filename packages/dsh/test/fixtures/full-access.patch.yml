# The full-access mode a user may pick for a session (docs/studio.md 6.3): no sandbox, no asking. The
# policy tests pass it after Presmium's patches, as the page's permission preset would set it.
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: never
