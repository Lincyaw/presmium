project:
  name: presmium-cloud
  languages:
  - typescript
requirements:
- id: REQ-001
  title: 每个用户一个完整的 Presmium Studio
  description: 注册登录后得到与本机 presmium studio 相同的全部功能（AI 助手、编辑、预览、放映、讲授制作、配音、诊断、导出），云端不另写编辑器或文稿存储。
  priority: P0
  status: implemented
  source: 用户决定云端采用每用户一个 Studio 容器的方案，删除原有的数据库文稿与部分功能的实现。
  code:
  - path: deploy/cloud/studio/Dockerfile
  - path: deploy/cloud/studio/entry.mjs
  - path: packages/cloud/src/node/studios.ts
  - path: packages/studio/src/studio.ts
  docs:
  - path: docs/rfc-cloud.md
  - path: docs/benchmarks/cloud-studio-2026-10-29.md
  notes: 回环部署中真实打开 Studio、文稿与预览；AI 助手入口与模型设置存在，未用真实模型密钥对话。
- id: REQ-002
  title: 注册登录与可撤销会话
  description: OIDC 注册登录，issuer 加 subject 唯一，退出后会话与 Studio 网关会话失效。
  priority: P0
  status: implemented
  code:
  - path: packages/cloud/src/node/auth.ts
  - path: deploy/cloud/keycloak/presmium-realm.json
  docs:
  - path: docs/cloud-deployment.md
  notes: 两个账号经 Keycloak 注册表单真实注册；退出后网关会话失效依赖外键级联，未单独在浏览器中复验。
- id: REQ-003
  title: Studio 网关与隔离
  description: 每个 Studio 两个主机名，一次性票据换取仅主机的网关 cookie，绑定所有者、登录会话与代次；保留 Host 转发 HTTP 与 WebSocket；每个 Studio 独立网络。
  priority: P0
  status: implemented
  code:
  - path: packages/cloud/src/node/gateway.ts
  - path: packages/cloud/src/node/docker.ts
  docs:
  - path: docs/rfc-cloud.md
  notes: 无 cookie、他人的网关 cookie、未知主机均为 401；证书询问只批准已有的 Studio。
- id: REQ-004
  title: 启停、空闲回收与时限
  description: 控制台写入意图，执行代理按租约对账；空闲停止、看门狗强制最长运行时间；停止保留卷。
  priority: P0
  status: implemented
  code:
  - path: packages/cloud/src/node/studios.ts
  - path: packages/cloud/src/node/runtime-watchdog.ts
  notes: 控制台停止后重新打开，8 秒内就绪，副本提交仍在；空闲回收与看门狗时限未在本轮等到触发。
- id: REQ-005
  title: 共享与创建副本
  description: 共享生成快照（源文件归档与网站），任何拿到链接的人可阅读；登录的读者把它创建为自己空间中的副本并在 Studio 中打开。
  priority: P0
  status: implemented
  code:
  - path: packages/cloud/src/node/shares.ts
  - path: deploy/cloud/studio/share-build.mjs
  docs:
  - path: docs/rfc-cloud.md
  notes: 未登录读者看到共享网站（动画可交互）；第二个账号创建副本，提交为“Fork: 冒泡排序”并打开；原作者的工作区不变。
- id: REQ-006
  title: MCP 接入
  description: 空间的访问令牌（只存散列，可撤销、可到期）经控制台 /mcp 转发到用户 Studio 中工作区服务的 MCP，需要时启动 Studio。
  priority: P0
  status: implemented
  code:
  - path: packages/cloud/src/node/mcp.ts
  notes: MCP 客户端经控制台列出 80 个工具并调用 list_documents；无效令牌 401。
- id: REQ-007
  title: 部署与存储配额
  description: Compose 部署、XFS 项目配额磁盘池（每个 Studio 一个 slot）、回环验证、备份恢复与升级说明。
  priority: P0
  status: partial
  code:
  - path: deploy/cloud/compose.yaml
  - path: packages/cloud/src/node/runtime-storage.ts
  docs:
  - path: docs/cloud-deployment.md
  notes: 回环部署（无配额的普通目录）真实运行；XFS 配额池、公网 HTTPS 与按需证书未在本轮验证。
