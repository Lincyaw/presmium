project:
  name: presmium-cloud
  languages:
  - typescript
requirements:
- id: REQ-001
  title: 每个用户一个完整的 Presmium Studio
  description: 注册登录后得到与本机 presmium studio 相同的全部功能；调度、登录到 Studio、路由与空闲回收由 JupyterHub 负责，云端不另写编辑器、文稿存储或调度。
  priority: P0
  status: implemented
  source: 用户决定云端采用每用户一个 Studio 的方案，并改用 JupyterHub。
  code:
  - path: deploy/cloud/hub/jupyterhub_config.py
  - path: deploy/cloud/studio/Dockerfile
  - path: deploy/cloud/studio/presmium_hub.py
  - path: packages/cloud/src/node/hub.ts
  docs:
  - path: docs/rfc-cloud.md
  - path: docs/benchmarks/cloud-hub-2026-10-29.md
  notes: 回环部署中经 JupyterHub 打开 Studio、文稿与预览；AI 助手入口与模型设置存在，未用真实模型密钥对话。
- id: REQ-002
  title: 注册登录
  description: Keycloak 一个 realm 两个客户端；控制台登录后进入 Studio 不需要再次输入密码；Hub 用户名为 OIDC sub。
  priority: P0
  status: implemented
  code:
  - path: packages/cloud/src/node/auth.ts
  - path: deploy/cloud/keycloak/presmium-realm.json
  notes: 三个账号经注册表单真实注册，进入 Studio 时没有再次登录。
- id: REQ-003
  title: 隔离
  description: 每个用户的服务器只对本人与控制台的服务令牌开放；Studio 容器在独立网络上，只读根文件系统、去掉全部 capabilities 并限制资源。
  priority: P0
  status: implemented
  code:
  - path: deploy/cloud/hub/jupyterhub_config.py
  - path: deploy/cloud/compose.yaml
  notes: 另一个用户访问他人的 studio、preview、cloud 路径均为 403。
- id: REQ-004
  title: 共享与创建副本
  description: 共享生成快照（源文件归档与网站），任何拿到链接的人可阅读；登录的读者把它创建为自己的副本并在 Studio 中打开，此前不必打开过 Studio。
  priority: P0
  status: implemented
  code:
  - path: packages/cloud/src/node/shares.ts
  - path: deploy/cloud/studio/control.mjs
  - path: deploy/cloud/studio/share-build.mjs
  notes: 匿名阅读与副本均在浏览器中完成；副本提交为“Fork: 冒泡排序”并直接打开。
- id: REQ-005
  title: MCP 接入
  description: 用户的访问令牌（只存散列，可撤销、可到期）经控制台 /mcp、Hub 与控制服务到达其 Studio 的工作区服务，需要时启动 Studio。
  priority: P0
  status: implemented
  code:
  - path: packages/cloud/src/node/mcp.ts
  notes: MCP 客户端列出 80 个工具并调用 list_documents；无效令牌 401。
- id: REQ-006
  title: 部署与运维
  description: Compose 部署（控制台、JupyterHub、Keycloak、PostgreSQL、对象存储、Caddy）、回环验证、备份恢复与升级说明。
  priority: P0
  status: partial
  code:
  - path: deploy/cloud/compose.yaml
  docs:
  - path: docs/cloud-deployment.md
  notes: 回环部署真实运行；公网 HTTPS、用户卷容量配额与 Kubernetes 未验证。
