# What the deploy test adds to templates/workspace/compose/compose.yaml (packages/workspace/test/deploy.test.ts):
# a login proxy that serve trusts beside oauth2-proxy (the test names the member; there is no identity
# provider to log in to), and a Messages-compatible model service that only the gateway reaches. The test
# writes the fixtures' path, the published port of the login proxy and the model's script directory.
services:
  serve:
    command: [presmium, serve, /workspace, --host, '${PRESMIUM_EDGE}.11', --port, '4310', --trust-proxy-from, '${PRESMIUM_EDGE}.10,${PRESMIUM_EDGE}.12', --user, serve]

  login:
    image: ${PRESMIUM_IMAGE}
    restart: 'no'
    user: node
    command: [node, /fixtures/login-proxy.mjs]
    environment:
      SERVE: 'http://${PRESMIUM_EDGE}.11:4310'
    volumes:
      - ${PRESMIUM_TEST_FIXTURES}:/fixtures:ro
    ports:
      - ${PRESMIUM_LOGIN_PORT}:8080
    networks:
      public: {}
      edge:
        ipv4_address: ${PRESMIUM_EDGE}.12

  model:
    image: ${PRESMIUM_IMAGE}
    restart: 'no'
    command: [node, /fixtures/fake-model.mjs]
    volumes:
      - ${PRESMIUM_TEST_FIXTURES}:/fixtures:ro
      - ./model:/script
    networks: [egress]
