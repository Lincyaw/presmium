# Publishes the examples on GitHub Pages. At the root, the example workspace (examples/workspace, copied by
# its try.mjs into a repository of its own, as `presmium serve` takes it): the home page lists its
# documents, each under <dir>/, built with `site.base` set to the Pages site's path; documents are created,
# edited and managed with `presmium serve` on one's own machine, so the static site has no such controls.
# Under demo/, the demo deck (examples/demo) in all three forms: the web form at demo/web/, the slides at
# demo/slides/ and the notebooks at demo/notebook/. The slides use hash routing (`routerMode: hash`,
# slide n at demo/slides/#/n; the web form's links follow it), because a static host serves no page for
# demo/slides/<n>. The workspace site's 404 page is the site's. The documentation site (WP-93d) joins this
# workflow under docs/.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demo
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The demo's code references read the repository's history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The Python the examples' recorded outputs were made with: in another version the build reuses them
      # with a warning for each, which the home page shows on the document's card. The builds see no
      # Chromium either (PLAYWRIGHT_BROWSERS_PATH names an empty directory; `pnpm install` downloads one for
      # playwright-chromium): the WebGPU example's recording, made on a GPU, is then reused without being
      # compared with the runner's software renderer.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
      - name: Python for compile-time execution
        run: python -m pip install nbformat nbclient ipykernel
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v5
      - name: The demo's site paths under the Pages site
        env:
          BASE: ${{ steps.pages.outputs.base_path }}/demo/
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs'
            const file = 'examples/demo/lecture.md'
            const base = process.env.BASE
            const text = readFileSync(file, 'utf8')
            const out = text
              .replace(/^  web: \{\}$/m, '  web: { base: ' + base + 'web/ }')
              .replace(/^  slides: \{\}$/m, '  slides: { base: ' + base + 'slides/, routerMode: hash }')
            if (!out.includes(base + 'web/') || !out.includes(base + 'slides/')) throw new Error('renderers.web and renderers.slides in ' + file + ' are no longer {}: set their base here another way')
            writeFileSync(file, out)
          "
      - run: pnpm demo:build
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/no-browsers
      - name: The example workspace's site, under the Pages site's path
        env:
          BASE: ${{ steps.pages.outputs.base_path }}/
          WORKSPACE: ${{ runner.temp }}/workspace
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/no-browsers
        run: |
          node examples/workspace/try.mjs "$WORKSPACE"
          sed -i "s#^site:\$#site:\n  base: $BASE#" "$WORKSPACE/presmium.workspace.yaml"
          grep -q "^  base: $BASE\$" "$WORKSPACE/presmium.workspace.yaml" || { echo "no site: block in $WORKSPACE/presmium.workspace.yaml to set its base in"; exit 1; }
          cd "$WORKSPACE" && node "$GITHUB_WORKSPACE/packages/cli/bin/presmium.mjs" build --out "$GITHUB_WORKSPACE/_site-workspace"
      - name: The site
        run: |
          cp -r _site-workspace/web _site
          cp -r examples/demo/dist _site/demo
          printf '<!doctype html><meta charset="utf-8"><title>Presmium</title><meta http-equiv="refresh" content="0; url=web/"><a href="web/">web/</a>\n' > _site/demo/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
