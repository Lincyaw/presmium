name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the examples and papers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v5
      - name: Set the sites' base paths
        env:
          BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs'
            for (const [directory, suffix] of [['gallery', ''], ['papers', 'papers/']]) {
              const path = 'examples/' + directory + '/presmium.workspace.yaml'
              const text = readFileSync(path, 'utf8')
              if (!/^site:$/m.test(text)) throw new Error('missing site configuration: ' + path)
              writeFileSync(path, text.replace(/^site:$/m, 'site:\n  base: ' + JSON.stringify(process.env.BASE + suffix)))
            }
          "
      - run: pnpm demo:check
      - run: pnpm demo:build
      - run: pnpm --filter presmium-papers check
      - run: pnpm --filter presmium-papers build
      - name: Include papers in the Pages site
        run: cp -R examples/papers/dist/web examples/gallery/dist/web/papers
      - name: Record the source CLI and revision
        run: |
          node --input-type=module -e "
            import { readFileSync, realpathSync, writeFileSync } from 'node:fs'
            import { createRequire } from 'node:module'
            import { resolve } from 'node:path'
            const require = createRequire(resolve('examples/papers/package.json'))
            const manifest = realpathSync(require.resolve('@lincyaw/presmium/package.json'))
            if (manifest !== resolve('packages/presmium/package.json')) throw new Error('Pages must use the source workspace CLI: ' + manifest)
            const { version } = JSON.parse(readFileSync(manifest, 'utf8'))
            const build = { commit: process.env.GITHUB_SHA, presmium: version, source: 'packages/presmium' }
            console.log(JSON.stringify(build))
            writeFileSync('examples/gallery/dist/web/build-info.json', JSON.stringify(build, null, 2) + '\n')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/gallery/dist/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
