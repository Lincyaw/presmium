name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build CS336
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v5
      - name: Set the course site's base
        env:
          BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs'
            const path = 'examples/cs336/presmium.workspace.yaml'
            const text = readFileSync(path, 'utf8')
            if (!/^site:$/m.test(text)) throw new Error('missing site configuration')
            writeFileSync(path, text.replace(/^site:$/m, 'site:\n  base: ' + JSON.stringify(process.env.BASE)))
          "
      - run: pnpm demo:check
      - run: pnpm demo:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/cs336/dist/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
