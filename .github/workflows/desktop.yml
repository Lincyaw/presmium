name: Desktop app

on:
  push:
    branches: [main]
    paths: ['packages/**', '.agents/skills/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['packages/desktop/**', '.github/workflows/desktop.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to build and attach installers to (leave empty for artifacts only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: windows-2025, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Linux libraries for the web view
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter . --filter presmium-desktop... install --frozen-lockfile
      # Signing and notarization use Tauri's environment variables when the repository has them as secrets.
      - name: Build installers
        shell: bash
        run: |
          # Without a certificate the build is unsigned; Tauri would try to import an empty one.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          # On macOS Tauri's DMG step mounts the image to lay it out, and detaching that mount times out on
          # the runners; the app is packed into a plain disk image below instead.
          if [ "$RUNNER_OS" = macOS ]; then
            pnpm --filter presmium-desktop build --bundles app
            bundle=packages/desktop/src-tauri/target/release/bundle
            mkdir -p "$bundle/dmg"
            # Compressing straight from the folder leaves about half the file as unused gaps between chunks;
            # converting a plain image writes the chunks back to back. LZMA (ULMO) needs macOS 10.15 or later.
            hdiutil create -volname "Presmium Studio" -srcfolder "$bundle/macos/Presmium Studio.app" -ov -format UDRW "$RUNNER_TEMP/presmium.dmg"
            hdiutil convert "$RUNNER_TEMP/presmium.dmg" -format ULMO -ov -o "$bundle/dmg/Presmium Studio.dmg"
            rm "$RUNNER_TEMP/presmium.dmg"
          else
            pnpm --filter presmium-desktop build
          fi
          # Tauri's deb is gzip with no setting for it; xz makes it about a third smaller.
          if [ "$RUNNER_OS" = Linux ]; then
            for deb in packages/desktop/src-tauri/target/release/bundle/deb/*.deb; do
              unpacked=$(mktemp -d)
              dpkg-deb -R "$deb" "$unpacked/package"
              dpkg-deb --root-owner-group -Zxz -b "$unpacked/package" "$deb"
              rm -rf "$unpacked"
            done
          fi
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p installers
          cd packages/desktop/src-tauri/target/release/bundle
          for file in deb/*.deb rpm/*.rpm dmg/*.dmg nsis/*.exe; do
            [ -f "$file" ] || continue
            name=$(basename "$file"); name=${name// /-}
            cp "$file" "$GITHUB_WORKSPACE/installers/${name%.*}-${{ matrix.target }}.${name##*.}"
          done
          ls -la "$GITHUB_WORKSPACE/installers"
      - uses: actions/upload-artifact@v4
        with:
          name: presmium-desktop-${{ matrix.target }}
          path: installers/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish installers
    # A push to main refreshes the rolling prerelease desktop-latest; a published release, or a dispatch with a tag, gets its own copies.
    if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: presmium-desktop-*
          path: installers
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            gh release upload "$RELEASE_TAG" installers/* --clobber
            exit 0
          fi
          # The prerelease and its tag stay put (the token may not move tags); each build replaces the assets.
          notes="Installers built from ${GITHUB_SHA::8} on main. Unsigned: on macOS Control-click the app and choose Open; on Windows choose More info, then Run anyway. 由 main 的 ${GITHUB_SHA::8} 构建，未签名：macOS 按住 Control 点按应用并选“打开”；Windows 点“更多信息”再点“仍要运行”。"
          if ! gh release view desktop-latest > /dev/null 2>&1; then
            gh release create desktop-latest --prerelease --latest=false --target "$GITHUB_SHA" --title "Presmium Studio desktop (latest main)" --notes "$notes"
          fi
          for old in $(gh release view desktop-latest --json assets --jq '.assets[].name'); do
            [ -e "installers/$old" ] || gh release delete-asset desktop-latest "$old" --yes
          done
          gh release upload desktop-latest installers/* --clobber
          gh release edit desktop-latest --notes "$notes"
