name: Temporary platform cwd probe
on:
  push:
    branches: [codex/platform-cwd-probe]
permissions:
  contents: read
jobs:
  native:
    if: ${{ false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Linux FUSE
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo modprobe fuse
          sudo chmod a+rw /dev/fuse
          command -v fusermount3 || (sudo apt-get update -qq && sudo apt-get install -y fuse3)
      - name: Official WinFsp
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi -OutFile $installer
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart ADDLOCAL=ALL" -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) { throw "WinFsp install failed: $($p.ExitCode)" }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          architecture: x64
          cache: ${{ runner.os == 'Linux' && 'pnpm' || '' }}
      - run: pnpm --filter @lincyaw/presmium... install --frozen-lockfile
      - run: node packages/dsh/build/client.mjs
      - name: Real native cwd and publication
        continue-on-error: true
        run: node bootstrap-cwd-probe.mjs
      - name: Real Harness review and publication
        if: always()
        run: node bootstrap-cwd-probe.mjs platform-harness-run.mjs
  native-fast-windows:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          architecture: x64
      - name: Matching WinFsp release
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi -OutFile $installer
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart ADDLOCAL=ALL" -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) { throw "WinFsp install failed: $($p.ExitCode)" }
      - name: Minimal native consumer
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'native-consumer'
          New-Item -ItemType Directory -Path $probe
          Copy-Item packages/dsh/src/node/candidate-paths.ts $probe
          Copy-Item native-fast-windows.mjs $probe
          Set-Location $probe
          '{"private":true,"type":"module","dependencies":{"deltabox-lite":"0.3.0","jiti":"2.7.0","@lincyaw/kernel":"1.0.0-rc.138"}}' | Set-Content package.json
          pnpm install --prod --registry https://registry.npmjs.org
          node native-fast-windows.mjs
