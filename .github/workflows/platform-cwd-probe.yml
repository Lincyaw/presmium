name: Temporary platform cwd probe
on:
  push:
    branches: [codex/platform-cwd-probe]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Linux FUSE
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo modprobe fuse
          sudo chmod a+rw /dev/fuse
          command -v fusermount3 || (sudo apt-get update -qq && sudo apt-get install -y fuse3)
      - name: Official WinFsp
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/winfsp/winfsp/releases/download/v2.2/winfsp-2.2.26323.msi -OutFile "$env:RUNNER_TEMP/winfsp.msi"
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "$env:RUNNER_TEMP/winfsp.msi", '/qn', '/norestart', 'ADDLOCAL=ALL') -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) { throw "WinFsp install failed: $($p.ExitCode)" }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: pnpm
      - run: pnpm --filter . --filter @lincyaw/dsh... install --frozen-lockfile
      - name: Real native cwd and publication
        run: node bootstrap-cwd-probe.mjs
