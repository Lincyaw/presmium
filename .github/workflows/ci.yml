name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete legacy integration and browser suites
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PRESMIUM_E2E_SLIDES_PORT: '4173'
  PRESMIUM_E2E_WEB_PORT: '4174'

jobs:
  check:
    name: Structure and installed consumer build
    if: github.event_name != 'workflow_dispatch' || !inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:structure
      - name: Pack public packages and install outside the repository
        run: pnpm consumer "$RUNNER_TEMP/presmium-consumer"
      - name: Check and build the installed consumer's document
        working-directory: ${{ runner.temp }}/presmium-consumer
        run: |
          pnpm exec presmium check .
          pnpm exec presmium build . --to web
          pnpm exec presmium build . --to slides

  full:
    name: Full suite (pnpm verify)
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python for compile-time execution and the notebook tests
        run: python -m pip install nbformat nbclient ipykernel
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: pnpm verify (tests, demo, every end-to-end test, the smoke tests in Firefox and WebKit, timings)
        run: pnpm verify
        env:
          PRESMIUM_E2E_BROWSERS: firefox,webkit
      - run: pnpm --filter presmium-papers check
      - run: pnpm --filter presmium-papers build
      - run: pnpm release:check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-full
          path: test-results/
          retention-days: 7
