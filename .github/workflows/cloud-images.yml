name: Cloud images

# Builds the Presmium Cloud images (deploy/cloud) from the repository source and pushes them to GHCR as
# ghcr.io/lincyaw/presmium-cloud-<name>:<version> (and :latest), for linux/amd64 and linux/arm64.
# deploy/cloud/install.sh pulls them by the release's version: tag v1.0.0-rc.130 -> image tag 1.0.0-rc.130.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag (v...) or commit to build
        required: true
        type: string
      version:
        description: Image tag; empty means the tag without its leading v
        required: false
        type: string
      latest:
        description: Also move the latest tag
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: cloud-images-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/lincyaw

jobs:
  version:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.version.outputs.ref }}
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - id: version
        env:
          REF: ${{ github.event.release.tag_name || inputs.ref }}
          VERSION: ${{ inputs.version }}
          LATEST: ${{ github.event_name == 'release' || inputs.latest }}
        run: |
          version=${VERSION:-${REF#v}}
          case $version in *[!A-Za-z0-9_.-]*|'') echo "invalid image tag: $version" >&2; exit 1 ;; esac
          { echo "ref=$REF"; echo "version=$version"; echo "latest=$LATEST"; } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        image: [api, hub, keycloak, studio]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
          - { image: api, dockerfile: deploy/cloud/Dockerfile }
          - { image: hub, dockerfile: deploy/cloud/hub/Dockerfile }
          - { image: keycloak, dockerfile: deploy/cloud/keycloak/Dockerfile }
          - { image: studio, dockerfile: deploy/cloud/studio/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The Studio image is about 5 GB with its toolchain, Chromium and the prebuilt viewer.
      - name: Free disk space
        if: matrix.image == 'studio'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.title=presmium-cloud-${{ matrix.image }}
          outputs: type=image,name=${{ env.REGISTRY }}/presmium-cloud-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: ${{ matrix.image }} (tags)
    needs: [version, build]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [api, hub, keycloak, studio]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-platform image
        env:
          IMAGE: ${{ env.REGISTRY }}/presmium-cloud-${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
          LATEST: ${{ needs.version.outputs.latest }}
        run: |
          tags=(-t "$IMAGE:$VERSION")
          [ "$LATEST" = true ] && tags+=(-t "$IMAGE:latest")
          sources=()
          for digest in digests/*; do sources+=("$IMAGE@sha256:${digest#digests/}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
