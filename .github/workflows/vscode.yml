name: VS Code extension

on:
  push:
    branches: [main]
    paths: ['packages/**', '.agents/skills/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/vscode.yml']
  pull_request:
    paths: ['packages/**', '.agents/skills/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/vscode.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to build and attach VSIX files to (leave empty for artifacts only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: vscode-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: VSIX (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: windows-2025, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter . --filter presmium-vscode... install --frozen-lockfile
      - run: pnpm --filter presmium-vscode package:vsix
      - name: Type-check extension and language server
        run: pnpm --filter presmium-vscode --filter @lincyaw/language-server typecheck
      - uses: actions/upload-artifact@v4
        with:
          name: presmium-vscode-${{ matrix.target }}
          path: packages/vscode/dist/*-${{ matrix.target }}.vsix
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Attach VSIX files to the release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: presmium-vscode-*
          path: vsix
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" vsix/*.vsix --clobber
